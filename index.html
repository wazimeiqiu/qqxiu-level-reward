<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#7C3AED">
<title>QQ秀 · 阶段奖励</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  background:#fff;color:#18181b;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.hero{
  position:relative;
  background:linear-gradient(180deg,#a78bfa 0%,#8b5cf6 55%,#7c3aed 100%);
  color:#fff;
  padding:18px 16px 0;
  padding-top:max(18px,env(safe-area-inset-top));
  overflow:hidden;
}
.hero::before{
  content:"";position:absolute;left:-40px;top:-40px;width:180px;height:180px;
  background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%);
  border-radius:50%;pointer-events:none;
}
.hero::after{
  content:"";position:absolute;right:-30px;top:30px;width:140px;height:140px;
  background:radial-gradient(circle,rgba(255,255,255,.12),transparent 70%);
  border-radius:50%;pointer-events:none;
}
.hero-top{position:relative;display:flex;align-items:center;justify-content:center;min-height:34px}
.close{position:absolute;left:0;top:50%;transform:translateY(-50%);width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;line-height:1;cursor:pointer;font-weight:300}
.hero-title{font-size:18px;font-weight:600;letter-spacing:2px}
.hero-sub{margin-top:8px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;opacity:.95}
.hero-sub .bolt{font-size:15px}
.hero-art{position:relative;height:170px;margin-top:10px;display:flex;align-items:flex-end;justify-content:center}
.chests{display:flex;align-items:flex-end;gap:6px;position:relative;z-index:2;margin-bottom:14px;filter:drop-shadow(0 6px 10px rgba(60,20,140,.35))}
.chest{line-height:1;display:inline-block}
.chest.s{font-size:38px}
.chest.m{font-size:46px}
.chest.l{font-size:58px}
.chest.xl{font-size:66px}
.clouds{position:absolute;left:0;right:0;bottom:0;height:46px;background:
  radial-gradient(ellipse at 18% 100%,#ddd6fe 0 22px,transparent 23px),
  radial-gradient(ellipse at 50% 100%,#c4b5fd 0 38px,transparent 39px),
  radial-gradient(ellipse at 82% 100%,#ddd6fe 0 22px,transparent 23px);
  opacity:.7}

.list{background:#fff;padding:8px 0 calc(20px + env(safe-area-inset-bottom))}
.item{display:flex;align-items:center;gap:14px;padding:12px 18px;position:relative}
.node-col{width:34px;display:flex;flex-direction:column;align-items:center;flex-shrink:0;align-self:stretch;justify-content:flex-start}
.node{
  width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:600;
  background:#fff;border:2px solid #e4e4e7;color:#a1a1aa;
  position:relative;z-index:2;flex-shrink:0;
}
.node.future{background:#fff;border-color:#e4e4e7;color:#a1a1aa}
.node.done{background:#a78bfa;border-color:#a78bfa;color:#fff}
.node.current{background:#7c3aed;border-color:#7c3aed;color:#fff;box-shadow:0 0 0 4px rgba(167,139,250,.28)}
.line{width:2px;flex:1;min-height:14px;background:#e4e4e7;margin:2px auto}
.line.done{background:#a78bfa}
.item:last-child .line{display:none}
.icon{
  width:54px;height:54px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  font-size:30px;flex-shrink:0;
  background:#f4f4f5;
}
.icon.coin{background:linear-gradient(135deg,#fef3c7,#fcd34d);box-shadow:inset 0 -2px 0 rgba(0,0,0,.06)}
.icon.catch{background:linear-gradient(135deg,#dbeafe,#93c5fd);box-shadow:inset 0 -2px 0 rgba(0,0,0,.06)}
.icon.theme{background:linear-gradient(135deg,#fce7f3,#f9a8d4);box-shadow:inset 0 -2px 0 rgba(0,0,0,.06)}
.text{flex:1;min-width:0}
.lv{font-size:12px;color:#a1a1aa;font-weight:500;letter-spacing:.5px}
.name{font-size:15px;color:#18181b;font-weight:500;margin-top:3px}
.name.muted{color:#71717a}
.item.future .name{color:#a1a1aa}
.item.future .lv{color:#d4d4d8}
</style>
</head>
<body>
<section class="hero">
  <div class="hero-top">
    <span class="close" aria-label="关闭">×</span>
    <span class="hero-title">阶段奖励</span>
  </div>
  <div class="hero-sub"><span class="bolt">⚡</span><span>当前 Lv<span id="curLvl">2</span></span></div>
  <div class="hero-art">
    <div class="clouds"></div>
    <div class="chests">
      <span class="chest s">🎁</span>
      <span class="chest m">🎁</span>
      <span class="chest xl">🎁</span>
      <span class="chest m">🎁</span>
      <span class="chest s">🎁</span>
    </div>
  </div>
</section>
<main class="list" id="list"></main>
<script>
  const REWARDS = [
    {lv:2,  type:'catch', icon:'🤝', name:'抓人次数 +1'},
    {lv:3,  type:'theme', icon:'🎪', name:'解锁主题秀场 · 主题01'},
    {lv:4,  type:'coin',  icon:'🪙', name:'秀米 +8'},
    {lv:5,  type:'theme', icon:'🎣', name:'解锁主题秀场 · 钓鱼湾'},
    {lv:6,  type:'catch', icon:'🤝', name:'抓人次数 +1'},
    {lv:7,  type:'theme', icon:'🎪', name:'解锁主题秀场 · 主题03'},
    {lv:8,  type:'coin',  icon:'🪙', name:'秀米 +11'},
    {lv:9,  type:'catch', icon:'🤝', name:'抓人次数 +1'},
    {lv:10, type:'theme', icon:'🕺', name:'解锁主题秀场 · 蹦迪台'},
    {lv:11, type:'catch', icon:'🤝', name:'抓人次数 +1（封顶）'},
    {lv:12, type:'coin',  icon:'🪙', name:'秀米 +14'},
    {lv:13, type:'theme', icon:'🎪', name:'解锁主题秀场 · 主题05'},
    {lv:14, type:'coin',  icon:'🪙', name:'秀米 +15'},
    {lv:15, type:'theme', icon:'🧘', name:'解锁主题秀场 · 修仙阁'},
    {lv:16, type:'coin',  icon:'🪙', name:'秀米 +17'},
    {lv:17, type:'theme', icon:'🎪', name:'解锁主题秀场 · 主题07'},
    {lv:18, type:'coin',  icon:'🪙', name:'秀米 +18'},
    {lv:19, type:'coin',  icon:'🪙', name:'秀米 +19'},
    {lv:20, type:'theme', icon:'🎸', name:'解锁主题秀场 · 乐队现场'},
    {lv:21, type:'coin',  icon:'🪙', name:'秀米 +21'},
    {lv:22, type:'theme', icon:'🎪', name:'解锁主题秀场 · 主题09'},
    {lv:23, type:'coin',  icon:'🪙', name:'秀米 +23'},
    {lv:24, type:'coin',  icon:'🪙', name:'秀米 +24'},
    {lv:25, type:'theme', icon:'🎧', name:'解锁主题秀场 · 电音节'},
  ];
  const CURRENT = 2;
  document.getElementById('curLvl').textContent = CURRENT;
  const list = document.getElementById('list');
  const frag = document.createDocumentFragment();
  REWARDS.forEach(r => {
    const done = r.lv < CURRENT;
    const isCur = r.lv === CURRENT;
    const isFuture = !done && !isCur;
    const nodeCls = isCur ? 'current' : (done ? 'done' : 'future');
    const nodeInner = (done || isCur) ? '\u2713' : r.lv;
    const lineCls = (done || isCur) ? 'done' : '';
    const item = document.createElement('div');
    item.className = 'item' + (isFuture ? ' future' : '');
    item.innerHTML =
      '<div class="node-col">' +
        '<div class="node ' + nodeCls + '">' + nodeInner + '</div>' +
        '<div class="line ' + lineCls + '"></div>' +
      '</div>' +
      '<div class="icon ' + r.type + '">' + r.icon + '</div>' +
      '<div class="text">' +
        '<div class="lv">Lv' + r.lv + '</div>' +
        '<div class="name">' + r.name + '</div>' +
      '</div>';
    frag.appendChild(item);
  });
  list.appendChild(frag);
</script>
</body>
</html>
